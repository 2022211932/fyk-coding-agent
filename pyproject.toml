[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yukai"
version = "0.3.0"
description = "Yukai - A Lightweight Autonomous Coding Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Feng Yikang" }]
dependencies = []

[project.scripts]
yukai = "fyk_agent.cli:main"
fyk-agent = "fyk_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
